name: Build Windows app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Smoke test (command line)
        run: python power_calc.py --auto
      - name: Smoke test (power measurement)
        run: python measure.py --seconds 4
      - name: Smoke test (window)
        run: python ci/smoke_gui.py
      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --name PCPowerCalc app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PCPowerCalc-windows
          path: dist/PCPowerCalc.exe
